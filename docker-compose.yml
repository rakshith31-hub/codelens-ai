version: "3.9"

services:
  neo4j:
    image: neo4j:5.24
    environment:
      - NEO4J_AUTH=neo4j/autodocs_pw
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - neo4j
    volumes:
      - chroma_data:/data/chroma
      - ./sample_repo:/data/sample_repo

volumes:
  neo4j_data:
  chroma_data:
